# Checks every push and pull request, and keeps the packages for trying out.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-about.exe
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Fetch the PawnIO files
        run: .\fetch-pawnio.ps1

      # Warnings are reported but don't fail the build yet: the code has some to clear first.
      - name: Clippy
        run: cargo clippy --all-targets --locked
      - name: Tests
        run: cargo test --locked

      - name: Build the packages
        run: |
          .\installer\build-release.ps1 -Stage Build
          .\installer\build-release.ps1 -Stage Package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: target/installer/*
          retention-days: 14
